name: CreatorFlow AI — Build Release

on:
  workflow_dispatch:
  push:
    tags: ['v']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEY_ALIAS: creatorflow-key
      ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew

      - name: Generate Release Keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PAST: ${{ secrets.KEY_PASSWORD }}
        run: |
          SP="${STORE_PASS}"
          KP="${KEY_PASS}"
          if [ -z "$SP" ]; then SP="creatorflow123"; fi
          if [ -z "$KP" ]; then KP="creatorflow123"; fi
          echo "ANDROID_KEY_PASSWORD=$KP" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=$SP" >> $GITHUB_ENV
          keytool -genkey -v \
            -keystore release.keystore \
            -alias creatorflow-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$SP" \
            -keypass "$KP" \
            -dname "CN=CreatorFlow, OU=CreatorFlow Labs, O=CreatorFlow, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Create google-services.json
        run: |
          cat > app/google-services.json << 'JSONEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "creatorflow-ai-placeholder",
              "storage_bucket": "creatorflow-ai-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:000000000000000000",
                "android_client_info": { "package_name": "com.creatorflow.ai" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "placeholder-key" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSONEOF

      - name: Build Release AAB
        run: ./gradlew bundleProdRelease

      - name: Build Release APK
        run: ./gradlew assembleProdRelease

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/prodRelease/*.aab

      - name: Upload APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/prodRelease/*.apk

      - name: Upload ProGuard Mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-txt
          path: app/build/outputs/mapping/prodRelease/mapping.txt
          if-no-files-found: ignore